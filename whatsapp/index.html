    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--noite);color:#fff;padding:24px;text-align:center}main{max-width:560px}.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.25)}h1{font-size:28px;line-height:1.1;margin:0 0 12px}p{color:#d7e5dc;font-size:16px;line-height:1.5;margin:0 0 22px}.actions{display:grid;gap:12px}.btn{display:block;background:var(--terra);color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:16px 22px}.btn.secondary{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}.small{font-size:13px;color:#9fb8aa;margin-top:18px}.note{font-size:13px;color:#9fb8aa;margin-top:14px;margin-bottom:0}

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TP6T33W" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <main class="card">
    <h1>Fale com a VMarket pelo WhatsApp</h1>
    <p>Escolha como prefere abrir a conversa. O clique é registrado para medir a origem da proposta.</p>
    <div class="actions">
      <a id="wa-app-link" class="btn" href="whatsapp://send?phone=5521977119126">Abrir no app do WhatsApp</a>
      <a id="wa-web-link" class="btn secondary" href="https://web.whatsapp.com/send?phone=5521977119126" rel="noopener">Abrir no WhatsApp Web</a>
    </div>
    <p class="note">Mensagem sugerida: “Oi! Vim da proposta da Vmarket e quero falar com comercial.”</p>
    <div class="small">VMarket Food Solutions</div>
  </main>
  <script>
    (function () {
      var phone = '5521977119126';
      var message = 'Oi! Vim da proposta da Vmarket e quero falar com comercial.';
      var params = new URLSearchParams(window.location.search);
      var source = params.get('utm_source') || 'proposta';
      var medium = params.get('utm_medium') || 'link';
      var campaign = params.get('utm_campaign') || 'proposta_food';
      var content = params.get('utm_content') || '';
      var term = params.get('utm_term') || '';
      var lpSegment = params.get('lp_segment') || 'food';
      var code = [campaign, medium, content].filter(Boolean).join('_').replace(/[^a-zA-Z0-9_\-]/g, '').slice(0, 80) || 'proposta_food';
      var encoded = encodeURIComponent(message);
      var appUrl = 'whatsapp://send?phone=' + phone + '&text=' + encoded;
      var webUrl = 'https://web.whatsapp.com/send?phone=' + phone + '&text=' + encoded;
      var waUrl = 'https://wa.me/' + phone + '?text=' + encoded;
      var payload = {
        whatsapp_phone: phone,
        whatsapp_message_code: code,
        whatsapp_message: message,
        page_location: window.location.href,
        page_referrer: document.referrer || '',
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign,
        utm_term: term,
        utm_content: content,
        lp_segment: lpSegment
      };
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push(Object.assign({ event: 'whatsapp_landing_ready' }, payload));
      try {
        localStorage.setItem('vm_last_whatsapp_click', JSON.stringify(Object.assign({ opened_at: new Date().toISOString() }, payload)));
      } catch (e) {}
      var appLink = document.getElementById('wa-app-link');
      var webLink = document.getElementById('wa-web-link');
      appLink.href = appUrl;
      webLink.href = webUrl;
      appLink.addEventListener('click', function () {
        window.dataLayer.push(Object.assign({ event: 'whatsapp_click', whatsapp_destination: 'app_protocol' }, payload));
        setTimeout(function () {
          var stillHere = !document.hidden;
          if (stillHere) window.location.href = waUrl;
        }, 1200);
      });
      webLink.addEventListener('click', function () {
        window.dataLayer.push(Object.assign({ event: 'whatsapp_click', whatsapp_destination: 'web_whatsapp' }, payload));
      });
    })();
  </script>
</body>
