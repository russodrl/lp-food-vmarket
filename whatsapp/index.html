  <style>
    :root{--noite:#123d31;--terra:#c96b2a;--claro:#f5f1ec;--texto:#23312a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--noite);color:#fff;padding:24px;text-align:center}main{max-width:520px}.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.25)}h1{font-size:28px;line-height:1.1;margin:0 0 12px}p{color:#d7e5dc;font-size:16px;line-height:1.5;margin:0 0 24px}.btn{display:inline-block;background:var(--terra);color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:16px 22px}.small{font-size:13px;color:#9fb8aa;margin-top:18px}

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TP6T33W" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <main class="card">
    <h1>Estamos abrindo o WhatsApp</h1>
    <p>Se não abrir automaticamente, toque no botão abaixo para falar com o time comercial da VMarket.</p>
    <a id="wa-link" class="btn" href="https://wa.me/5521977119126" rel="noopener">Abrir WhatsApp</a>
    <div class="small">VMarket Food Solutions</div>
  </main>
  <script>
    (function () {
      var phone = '5521977119126';
      var params = new URLSearchParams(window.location.search);
      var utm = {};
      ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','lp_segment'].forEach(function (key) {
        var value = params.get(key);
        if (value) utm[key] = value;
      });

      var source = utm.utm_source || 'proposta';
      var medium = utm.utm_medium || 'link';
      var campaign = utm.utm_campaign || 'proposta_food';
      var content = utm.utm_content || '';
      var code = [campaign, medium, content].filter(Boolean).join('_').replace(/[^a-zA-Z0-9_\-]/g, '').slice(0, 80);
      if (!code) code = 'proposta_food';

      var message = 'Oi! Vim da proposta da Vmarket e quero falar com comercial.';
      var finalUrl = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);

      var payload = {
        event: 'whatsapp_redirect',
        whatsapp_phone: phone,
        whatsapp_message_code: code,
        whatsapp_destination: 'wa_me',
        page_location: window.location.href,
        page_referrer: document.referrer || '',
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign,
        utm_term: utm.utm_term || '',
        utm_content: content,
        lp_segment: utm.lp_segment || 'food'
      };
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push(payload);

      try {
        localStorage.setItem('vm_last_whatsapp_click', JSON.stringify(Object.assign({ clicked_at: new Date().toISOString() }, payload)));
      } catch (e) {}

      var link = document.getElementById('wa-link');
      link.href = finalUrl;
      link.addEventListener('click', function () {
        window.dataLayer.push(Object.assign({}, payload, { event: 'whatsapp_manual_click' }));
      });

      setTimeout(function () {
        window.location.href = finalUrl;
      }, 250);
    })();
  </script>
</body>
